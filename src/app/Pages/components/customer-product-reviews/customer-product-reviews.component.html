<div nz-row nzType="flex">
    <div nz-col nzXs="24" nzSm="24" nzMd="20" nzLg="20" nzXl="12">
        <div class="formname">
            <span (click)="back()" nz-icon nzType="arrow-left" nzTheme="outline"
                style="font-weight: bold; cursor: pointer"></span>&nbsp;&nbsp;<b> {{ formTitle }} </b>
        </div>
    </div>

    <div nz-col nzXs="24" nzSm="24" nzMd="4" nzLg="6" nzXl="12" style="display: flex; justify-content: flex-end">
        <form nz-form [nzLayout]="'inline'">
            <nz-form-item>
                <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
                    <input type="text" name="aboutsearch" (keyup)="keyup($event)" [(ngModel)]="searchText" nz-input
                        placeholder=" Search Record" />
                </nz-input-group>
                <ng-template #suffixIconButton>
                    <button nz-button nzType="primary" (click)="search(true)" nzSearch>
                        <i nz-icon nzType="search"></i>
                    </button>
                </ng-template>
            </nz-form-item>

<div nz-row>
    <div nz-col nzSpan="24" style="width: 100%">
        <nz-table nzBordered #ProductReviewTable nzShowSizeChanger [nzFrontPagination]="false" [nzData]="dataList"
            [nzLoading]="loadingRecords" [nzSize]="'small'" [nzScroll]="{ y: '64vh' }" [nzTotal]="totalRecords"
            [(nzPageIndex)]="pageIndex" [(nzPageSize)]="pageSize" (nzPageIndexChange)="search()"
            (nzPageSizeChange)="search(true)" (nzQueryParams)="sort($event)" style="width: 100%">
            <thead>
                <tr>
                    <th nzColumnKey="{{ 'PRODUCT_NAME' }}" [nzSortFn]="true" nzWidth="25px" style="text-align: center">
                        <b> Product Name</b>
                    </th>
                    <th nzColumnKey="{{ 'CUSTOMER_NAME' }}" [nzSortFn]="true" nzWidth="25px" style="text-align: center">
                        <b> Customer Name </b>
                    </th>

                    <th nzColumnKey="{{ 'RATINGS' }}" [nzSortFn]="true" nzWidth="10px" style="text-align: center">
                        <b> Ratings </b>
                    </th>
                    <th nzColumnKey="{{ 'REVIEW' }}" [nzSortFn]="true" nzWidth="30px" style="text-align: center">
                        <b> Review </b>
                    </th>

                    <th nzColumnKey="{{ 'STATUS' }}" [nzSortFn]="true" nzWidth="10px" style="text-align: center">
                        <b> Status </b>
                        <ng-container *ngIf="toggleVisible">
                            <div (click)="$event.stopPropagation()">
                                <nz-switch [(ngModel)]="headerToggles.IS_ACTIVE"
                                    (ngModelChange)="bulkUpdate('IS_ACTIVE', $event)">
                                </nz-switch>
                            </div>
                        </ng-container>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let data of ProductReviewTable.data">
                    <td style="text-align: center">{{ data["PRODUCT_NAME"] }}</td>

                    <td style="text-align: center">{{ data["CUSTOMER_NAME"] }}</td>

                    <td style="text-align:center">{{ data["RATINGS"] }}</td>

                    <td align="left" [nzTooltipTitle]="isTextOverflow ? data['REVIEW'] : null" #tooltipRef1="nzTooltip"
                        nz-tooltip>
                        <div #textContainer1 class="truncate-text"
                            (mouseenter)="checkOverflow(textContainer1, tooltipRef1)">
                            {{ data["REVIEW"] ? data["REVIEW"] : "-" }}
                        </div>
                    </td>
                    <td style="text-align: center">
                        <nz-switch [ngModel]="data.STATUS == 1" (ngModelChange)="onStatusChange(data, $event)">
                        </nz-switch>
                    </td>
                </tr>
            </tbody>
        </nz-table>
    </div>
</div>
